name: YP-S3 test bootloader

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
          # Rockbox looks for the arm-elf-eabi- prefix
          mkdir -p "$HOME/bin"
          for t in /usr/bin/arm-none-eabi-*; do
            n=$(basename "$t")
            ln -s "$t" "$HOME/bin/${n/arm-none-eabi/arm-elf-eabi}"
          done
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          mkdir build-yps3-bl
          cd build-yps3-bl
          ../tools/configure --target=samsungyps3 --type=b
          make -j"$(nproc)"

      - name: Package
        run: |
          mkdir out
          cp build-yps3-bl/rockboot.ebn build-yps3-bl/bootloader.map out/
          cp utils/s5l8700_dfu/s5l8700_dfu.py out/
          cp YPS3-PORT.md out/

      - uses: actions/upload-artifact@v4
        with:
          name: yps3-test-bootloader
          path: out/
